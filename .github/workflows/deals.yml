name: Angebote aktualisieren

on:
  push:
    branches-ignore: [data, notify]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"   # stündlich, damit Auktionen kurz vor Ende erfasst werden

permissions:
  contents: write   # Preishistorie auf den Branch "data" schreiben
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preishistorie laden
        run: |
          if git fetch --depth=1 origin data; then
            git worktree add --detach history FETCH_HEAD
          else
            git worktree add --orphan -b data history
          fi
      - name: Angebote von eBay holen
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          HISTORY_FILE: history/history.json
        run: node scripts/fetch-deals.mjs
      - name: Mini-PCs von eBay holen
        # Eigene Kategorie: Fehler hier dürfen die Grafikkarten-Seite nicht aufhalten
        continue-on-error: true
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          MINIPC_CACHE: history/minipc-cache.json
          MINIPC_HISTORY: history/minipc-history.json
        run: node scripts/minipc.mjs
      - name: Arbeitsspeicher von eBay holen
        continue-on-error: true
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          RAM_HISTORY: history/ram-history.json
        run: node scripts/ram.mjs
      - name: eBay-API-Verbrauch abfragen
        continue-on-error: true
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          USAGE_FILE: history/usage.json
        run: node scripts/usage.mjs
      - name: Tabellen zusammenstellen
        continue-on-error: true
        env:
          HISTORY_DIR: history
        run: node scripts/tables.mjs
      - name: Preishistorie speichern
        working-directory: history
        run: |
          [ -f history.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json markets.json
          for f in minipc-cache.json minipc-history.json ram-history.json ram-markets.json usage.json; do [ -f $f ] && git add $f; done
          git diff --cached --quiet && exit 0
          # Nur den aktuellen Stand behalten (ein Commit), damit das Repo nicht mit jedem Lauf wächst
          git checkout -q --orphan snapshot
          git commit -q -m "Preishistorie $(date -u +%FT%TZ)"
          git push -q -f origin HEAD:refs/heads/data
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/data
          cp index.html searches.json _site/
          cp data/deals.json data/stats.json _site/data/
          cp data/minipc.json data/minipc-stats.json _site/data/ 2>/dev/null || true
          cp data/ram.json data/ram-stats.json _site/data/ 2>/dev/null || true
          cp data/usage.json data/tables.json _site/data/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
